name: Build OpenClaw ARM64

on:
  pull_request:
    paths:
      - ".github/workflows/build-openclaw-arm64.yml"
      - "clusters/eldertree/openclaw/**"
      - "scripts/openclaw/**"
      - "VERSION"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-openclaw-arm64.yml"
      - "clusters/eldertree/openclaw/**"
      - "scripts/openclaw/**"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-check:
    if: github.event_name == 'pull_request'
    uses: raolivei/github-workflows/.github/workflows/version-check.yml@main
    with:
      content-paths: "clusters/eldertree/openclaw/docker/"
      runs-on: ubuntu-24.04-arm

  validate:
    # Application-specific tests: build locally and never publish from this job.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      upstream_image: ${{ steps.inputs.outputs.upstream_image }}
      kubectl_version: ${{ steps.inputs.outputs.kubectl_version }}
      kubectl_sha256: ${{ steps.inputs.outputs.kubectl_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install manifest reader
        run: python -m pip install PyYAML==6.0.3

      - name: Validate locked dependencies
        id: inputs
        run: |
          python scripts/openclaw/build_inputs.py --github-output "$GITHUB_OUTPUT"
          python -m unittest discover -s scripts/openclaw -p 'test_*.py' -v

      - uses: docker/setup-buildx-action@v4

      - name: Build local image for runtime tests
        uses: docker/build-push-action@v7
        with:
          context: clusters/eldertree/openclaw/docker
          platforms: linux/arm64
          load: true
          push: false
          tags: openclaw:ci
          build-args: |
            OPENCLAW_IMAGE=${{ steps.inputs.outputs.upstream_image }}
            KUBECTL_VERSION=${{ steps.inputs.outputs.kubectl_version }}
            KUBECTL_SHA256=${{ steps.inputs.outputs.kubectl_sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify ARM64 config, migration and gateway startup
        run: python scripts/openclaw/smoke.py openclaw:ci

      - name: Verify the ARM64 Ollama fallback API
        run: python scripts/openclaw/smoke_ollama.py

  build:
    needs: validate
    # Match the established pattern: PRs validate; main/manual runs publish.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    uses: raolivei/github-workflows/.github/workflows/docker-build.yml@main
    with:
      image-name: openclaw
      context: clusters/eldertree/openclaw/docker
      dockerfile: Dockerfile
      platforms: linux/arm64
      runs-on: ubuntu-24.04-arm
      build-args: |
        OPENCLAW_IMAGE=${{ needs.validate.outputs.upstream_image }}
        KUBECTL_VERSION=${{ needs.validate.outputs.kubectl_version }}
        KUBECTL_SHA256=${{ needs.validate.outputs.kubectl_sha256 }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
