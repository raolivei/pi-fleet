name: Build OpenClaw ARM64

on:
  pull_request:
    paths:
      - ".github/workflows/build-openclaw-arm64.yml"
      - "clusters/eldertree/openclaw/**"
      - "scripts/openclaw/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-openclaw-arm64.yml"
      - "clusters/eldertree/openclaw/**"
      - "scripts/openclaw/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the locked release after validation (pre-stage before a coordinated GitOps merge)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    # Public repository: hosted ARM64 avoids cross-compilation and QEMU entirely.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      input_hash: ${{ steps.release.outputs.input_hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install manifest reader
        run: python -m pip install PyYAML==6.0.3

      - name: Validate locked release inputs
        id: release
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--github-output "$GITHUB_OUTPUT")
          if [[ -n "$BASE_REVISION" && ! "$BASE_REVISION" =~ ^0+$ ]]; then
            args+=(--check-version-against "$BASE_REVISION")
          fi
          python scripts/openclaw/release.py "${args[@]}"
          python -m unittest discover -s scripts/openclaw -p 'test_*.py' -v

      - uses: docker/setup-buildx-action@v4

      - name: Build candidate without publishing
        uses: docker/build-push-action@v7
        with:
          context: clusters/eldertree/openclaw/docker
          platforms: linux/arm64
          load: true
          push: false
          tags: openclaw:ci
          build-args: |
            OPENCLAW_IMAGE=${{ steps.release.outputs.upstream_image }}
            KUBECTL_VERSION=${{ steps.release.outputs.kubectl_version }}
            KUBECTL_SHA256=${{ steps.release.outputs.kubectl_sha256 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.image_version }}
            io.eldertree.openclaw.version=${{ steps.release.outputs.upstream_version }}
            io.eldertree.build-inputs=${{ steps.release.outputs.input_hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify ARM64 config, migration and gateway startup
        run: python scripts/openclaw/smoke.py openclaw:ci

      - name: Verify the ARM64 Ollama fallback API
        run: python scripts/openclaw/smoke_ollama.py

      - name: Export the tested image for publication
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        run: docker save openclaw:ci -o /tmp/openclaw-tested.tar

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        with:
          name: openclaw-tested
          path: /tmp/openclaw-tested.tar
          compression-level: 0
          retention-days: 1

  publish:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Serialize branch pre-staging and main publication of the same release.
    concurrency:
      group: openclaw-publish-${{ needs.validate.outputs.image_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: openclaw-tested
          path: /tmp

      - name: Load the exact tested image
        run: docker load -i /tmp/openclaw-tested.tar

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable version tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw:${{ needs.validate.outputs.image_tag }}
          INPUT_HASH: ${{ needs.validate.outputs.input_hash }}
        run: |
          bash scripts/openclaw/publish.sh openclaw:ci "$IMAGE" "$INPUT_HASH"
          echo "Published validated release: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
