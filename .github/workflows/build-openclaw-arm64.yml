name: Build OpenClaw ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-openclaw-arm64.yml"
      - "clusters/eldertree/openclaw/docker/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openclaw
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # pi-fleet has no Eldertree scale set yet (see ARC_RUNNERS.md); GitHub-hosted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read pinned OpenClaw release
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ARG OPENCLAW_VERSION=//p' clusters/eldertree/openclaw/docker/Dockerfile)
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected one semver OPENCLAW_VERSION ARG, got: ${version:-<empty>}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building upstream OpenClaw $version"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # A manual branch build pre-stages the reviewed release before the
            # GitOps config that consumes it merges. Main also rebuilds it.
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: clusters/eldertree/openclaw/docker
          file: clusters/eldertree/openclaw/docker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify packaged OpenClaw release
        env:
          OPENCLAW_VERSION: ${{ steps.upstream.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker run --rm --platform linux/arm64 --entrypoint node "$image" \
            /app/dist/index.js --version | grep -F "${OPENCLAW_VERSION#v}"

      - name: Summary
        run: |
          {
            echo "## OpenClaw Build Complete"
            echo ""
            echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "**Upstream release:** \`${{ steps.upstream.outputs.version }}\`"
            echo "**Platform:** \`linux/arm64\`"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
