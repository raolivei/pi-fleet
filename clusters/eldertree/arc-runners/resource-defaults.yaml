apiVersion: v1
kind: LimitRange
metadata:
  name: runner-container-defaults
  namespace: arc-runners
spec:
  limits:
    - type: Container
      # ARC injects DinD as a native sidecar init container on Kubernetes 1.29+.
      # Defaults reach generated containers without replacing the chart template.
      # Explicit runner requests and limits continue to take precedence.
      defaultRequest:
        cpu: 50m
        memory: 256Mi
      default:
        # Retain the headroom documented for Elder's npm/TypeScript builds.
        cpu: "2"
        memory: 3Gi
