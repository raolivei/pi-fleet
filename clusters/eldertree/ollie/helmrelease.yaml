apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    # One recovery attempt after fixing the underlying configuration/availability.
    reconcile.fluxcd.io/requestedAt: "2026-11-12-health-recovery"
    reconcile.fluxcd.io/resetAt: "2026-11-12-health-recovery"
  name: ollie
  namespace: ollie
spec:
  interval: 30m
  chart:
    spec:
      chart: ./helm/ollie
      version: "0.1.2"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 30m
  releaseName: ollie
  values:
    imagePullSecrets:
      - name: ghcr-secret
    audio:
      enabled: false
    ollama:
      # host.docker.internal does not resolve in k3s. Direct fallback uses the
      # Mac's Tailscale address; primary inference goes through Elder (ollie#151).
      externalUrl: "http://100.97.229.104:11434"
      deployOnCluster: false
    elder:
      url: "http://elder.openclaw.svc.cluster.local:8000"
    workspace:
      root: "/workspace"
      hostPath: "/mnt/workspace"
    monitoring:
      enabled: true
      port: "8000"
      path: "/metrics"
    core:
      image:
        repository: ghcr.io/raolivei/ollie-core
        tag: v0.6.0
        pullPolicy: Always
      resources:
        requests:
          memory: "512Mi"
          cpu: "200m"
        limits:
          memory: "1Gi"
          cpu: "1000m"
      env:
        ollamaModel: "llama3.1:8b"
    frontend:
      enabled: true
      image:
        repository: ghcr.io/raolivei/ollie-frontend
        tag: v0.4.5
        pullPolicy: Always
    training:
      enabled: false # ghcr.io/raolivei/ollie-training:latest not published yet
