apiVersion: v1
kind: ConfigMap
metadata:
  name: elder-config
  namespace: openclaw
  labels:
    app: openclaw
    component: elder
data:
  ELDER_REPO_SYNC_INTERVAL_HOURS: "6"
  ELDER_GITHUB_OWNER: "raolivei"
  ELDER_LLM_TIMEOUT_SECONDS: "30"
  # Was defaulting to localhost:11434 (unreachable from inside the pod) with
  # model qwen2.5:14b (not even pulled on the Mac) -- elder_best_answer's
  # "ollama"/"ollama-heavy" providers were reporting available=true (a bare
  # truthy check) but never actually worked. Point at the same Mac LAN IP
  # OpenClaw's primary uses, and models that are actually present.
  # 2026-11: the LAN IP is unroutable whenever the Mac is off the home network
  # ("No route to host" from the elder pod) and qwen2.5:32b is not pulled. Use
  # the Mac's Tailscale address (same as OpenClaw's primary) and an installed
  # model. Elder is the single local-only LLM router for Ollie (ollie#151).
  ELDER_OLLAMA_BASE_URL: "http://100.97.229.104:11434"
  ELDER_OLLAMA_MODEL: "llama3.1:8b"
  ELDER_OLLAMA_HEAVY_MODEL: "qwen3.6:35b-mlx"
