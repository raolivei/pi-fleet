# Applied by `openclaw approvals set --file` on startup to the canonical SQLite store.
# Mount only as input; never copy this into the retired ~/.openclaw/exec-approvals.json path.
# Policy: gateway exec security full (cluster boundary = RBAC in rbac.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-exec-approvals
  namespace: openclaw
  labels:
    app: openclaw
data:
  exec-approvals.json: |
    {
      "version": 1,
      "defaults": {
        "security": "full",
        "ask": "off",
        "askFallback": "full",
        "autoAllowSkills": true
      },
      "agents": {
        "main": {
          "security": "full",
          "ask": "off",
          "askFallback": "full",
          "autoAllowSkills": true
        }
      }
    }
