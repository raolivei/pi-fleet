apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: openclaw
  namespace: openclaw
spec:
  imageRepositoryRef:
    name: openclaw
  # The ARM64 workflow publishes the exact reviewed upstream release from the
  # Dockerfile (vYYYY.M.P). Date tags only proved that a rebuild happened; they
  # did not prove which OpenClaw source release was inside the image.
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=2026.9.5 <2027.0.0"
