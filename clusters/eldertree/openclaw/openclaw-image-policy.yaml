apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: openclaw
  namespace: openclaw
spec:
  imageRepositoryRef:
    name: openclaw
  # The shared docker-build.yml publishes pi-fleet's root VERSION. The
  # 1.4.x stable range opens only after the 1.3.x migration bridge has been
  # deployed and its live persisted state verified.
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=1.4.0 <1.5.0"
