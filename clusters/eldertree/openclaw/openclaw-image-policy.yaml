apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: openclaw
  namespace: openclaw
spec:
  imageRepositoryRef:
    name: openclaw
  # The shared docker-build.yml publishes pi-fleet's root VERSION. Hold the
  # 1.3.x migration bridge until its live persisted state has been verified;
  # the next upstream upgrade opens 1.4.x in a separate reviewed PR.
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=1.3.2 <1.4.0"
