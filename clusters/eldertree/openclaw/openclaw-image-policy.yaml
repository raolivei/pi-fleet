apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: openclaw
  namespace: openclaw
spec:
  imageRepositoryRef:
    name: openclaw
  # Promote only after the 0.1.x bridge has migrated and verified the live PVC.
  # The 0.2.x line tracks the reviewed upstream 2026.10.8 runtime; further
  # upstream upgrades require a new wrapper minor and policy review.
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=0.2.0 <0.3.0"
