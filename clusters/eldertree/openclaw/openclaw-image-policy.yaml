apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: openclaw
  namespace: openclaw
spec:
  imageRepositoryRef:
    name: openclaw
  # Wrapper versions are independent of upstream releases. Keep the 0.1.x
  # bridge line until its persisted-state migration is verified; opening 0.2.x
  # requires a separate reviewed change to this policy and build.lock.json.
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: ">=0.1.0 <0.2.0"
