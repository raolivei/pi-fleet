apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw
  namespace: openclaw
spec:
  interval: 30m
  chart:
    spec:
      chart: ./helm/eldertree-app
      version: "0.1.1"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 12h
  targetNamespace: openclaw
  releaseName: openclaw
  upgrade:
    cleanupOnFail: false
    timeout: 10m
  values:
    # ============================================================
    # OpenClaw - LLM gateway + Elder AI agent
    # ============================================================
    components:
      openclaw:
        image:
          repository: ghcr.io/raolivei/openclaw
          tag: "v0.1.0" # {"$imagepolicy": "openclaw:openclaw:tag"}
          pullPolicy: Always
        port: 18789
        strategy: Recreate
        serviceAccountName: openclaw
        # Stakater Reloader (running in kube-system) restarts this pod whenever the
        # openclaw-config-file ConfigMap changes, so model-chain edits take effect
        # without a manual `kubectl rollout restart`. The init script then re-seeds
        # openclaw.json from the ConfigMap on the resulting fresh container start.
        podAnnotations:
          configmap.reloader.stakater.com/reload: "openclaw-config-file"
        command:
          - /usr/local/bin/openclaw-cluster-start
        env:
          - name: TELEGRAM_BOT_TOKEN
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: TELEGRAM_BOT_TOKEN
          - name: OPENCLAW_GATEWAY_TOKEN
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: OPENCLAW_GATEWAY_TOKEN
          - name: BRAVE_API_KEY
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: BRAVE_API_KEY
          - name: GROQ_API_KEY
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: GROQ_API_KEY
                optional: true
          - name: OPENROUTER_API_KEY
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: OPENROUTER_API_KEY
          - name: ELDER_API_KEY
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: ELDER_API_KEY
          - name: BRAPI_API_KEY
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: BRAPI_API_KEY
                optional: true
          - name: HOME
            value: /home/node
          - name: NODE_OPTIONS
            value: "--max-old-space-size=2048 --unhandled-rejections=warn"
        envFrom:
          - configMapRef:
              name: openclaw-config
        resources:
          requests: {cpu: "200m", memory: "1536Mi"}
          limits: {cpu: "1000m", memory: "3Gi"}
        probes:
          path: /health
          port: 18789
          # Doctor is bounded to 300s; allow migration + gateway startup before
          # liveness can interrupt writes to the PVC. Readiness stays closed.
          liveness: {initialDelaySeconds: 600, periodSeconds: 30, timeoutSeconds: 10}
          readiness: {initialDelaySeconds: 150, periodSeconds: 10, timeoutSeconds: 5}
        volumeMounts:
          - name: openclaw-data
            mountPath: /home/node/.openclaw
          - name: config-file
            mountPath: /etc/openclaw-config
            readOnly: true
          - name: exec-approvals-defaults
            mountPath: /etc/openclaw-defaults
            readOnly: true
          - name: skills
            mountPath: /home/node/.openclaw/workspace/skills
            readOnly: true
          - name: workspace-files
            mountPath: /home/node/.openclaw/workspace/TOOLS.md
            subPath: TOOLS.md
            readOnly: true
        volumes:
          - name: openclaw-data
            persistentVolumeClaim:
              claimName: openclaw-data
          - name: config-file
            configMap:
              name: openclaw-config-file
          - name: exec-approvals-defaults
            configMap:
              name: openclaw-exec-approvals
          - name: skills
            configMap:
              name: openclaw-skills
          - name: workspace-files
            configMap:
              name: openclaw-workspace-files
      elder:
        image:
          repository: ghcr.io/raolivei/elder
          tag: v0.3.7 # {"$imagepolicy": "openclaw:elder:tag"}
          pullPolicy: Always
        port: 8006
        servicePort: 8000
        strategy: Recreate
        serviceAccountName: elder
        envFrom:
          - configMapRef:
              name: elder-config
        env:
          - name: ELDER_PORT
            value: "8006"
          - name: ELDER_K8S_IN_CLUSTER
            value: "true"
          - name: ELDER_REPOS_DIR
            value: "/data/repos"
          - name: ELDER_APPROVAL_DB_PATH
            value: "/data/approvals.db"
          - name: ELDER_API_KEY
            valueFrom:
              secretKeyRef:
                name: elder-secrets
                key: API_KEY
          - name: ELDER_GITHUB_APP_ID
            valueFrom:
              secretKeyRef:
                name: elder-secrets
                key: GITHUB_APP_ID
          - name: ELDER_GITHUB_APP_INSTALLATION_ID
            valueFrom:
              secretKeyRef:
                name: elder-secrets
                key: GITHUB_APP_INSTALLATION_ID
          - name: ELDER_GITHUB_APP_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                name: elder-secrets
                key: GITHUB_APP_PRIVATE_KEY
          - name: ELDER_GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: elder-secrets
                key: GEMINI_API_KEY
                optional: true
          - name: ELDER_GROQ_API_KEY
            valueFrom:
              secretKeyRef:
                name: elder-secrets
                key: GROQ_API_KEY
                optional: true
          - name: ELDER_GMAIL_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: ELDER_GMAIL_CLIENT_ID
                optional: true
          - name: ELDER_GMAIL_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: ELDER_GMAIL_CLIENT_SECRET
                optional: true
          - name: ELDER_GMAIL_REFRESH_TOKEN
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: ELDER_GMAIL_REFRESH_TOKEN
                optional: true
          - name: ELDER_GMAIL_USER_EMAIL
            valueFrom:
              secretKeyRef:
                name: openclaw-secrets
                key: ELDER_GMAIL_USER_EMAIL
                optional: true
        resources:
          requests: {cpu: "250m", memory: "256Mi"}
          limits: {cpu: "500m", memory: "512Mi"}
        probes:
          path: /health
          port: 8006
          liveness: {initialDelaySeconds: 30, periodSeconds: 30, timeoutSeconds: 10}
          readiness: {initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5}
        volumeMounts:
          - name: elder-data
            mountPath: /data
        volumes:
          - name: elder-data
            persistentVolumeClaim:
              claimName: elder-data
    # -- Middleware
    middleware:
      redirect-https:
        type: redirectScheme
        scheme: https
        permanent: true
    # -- Ingress
    ingress:
      openclaw-web:
        host: openclaw.eldertree.local
        service: openclaw
        port: 18789
        middlewares:
          - openclaw-redirect-https@kubernetescrd
        tls:
          secretName: openclaw-tls
          certManager: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: openclaw.eldertree.local
      elder:
        host: elder.eldertree.local
        service: elder
        port: 8000
        tls:
          secretName: elder-tls
          certManager: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: elder.eldertree.local
      control-center:
        host: control.eldertree.local
        service: elder
        port: 8000
        tls:
          secretName: control-tls
          certManager: true
        annotations:
          external-dns.alpha.kubernetes.io/hostname: control.eldertree.local
      # --- Public (control.eldertree.xyz) ---
      control-center-public:
        host: control.eldertree.xyz
        service: elder
        port: 8000
        tls:
          secretName: control-cloudflare-origin-tls
        annotations:
          external-dns.alpha.kubernetes.io/exclude: "true"
