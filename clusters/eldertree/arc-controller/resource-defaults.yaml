apiVersion: v1
kind: LimitRange
metadata:
  name: controller-container-defaults
  namespace: arc-controller
spec:
  limits:
    - type: Container
      # Listener pods otherwise have no resource requests or limits. Preserve
      # the controller's explicit resources and default only missing values.
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 200m
        memory: 128Mi
