apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      # Target the ACTIVE (leader) pod, not the round-robin `vault` Service.
      # `vault` load-balances across all pods; a sealed or non-member standby
      # answers with a 307 to the leader's pod IP, which ESO follows and fails
      # on once that IP changes (observed: "dial tcp 10.42.1.71:8200: no route
      # to host" after a vault-0 restart). `vault-active` only ever selects the
      # current leader.
      server: http://vault-active.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets


