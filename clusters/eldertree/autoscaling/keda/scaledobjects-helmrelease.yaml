apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  annotations:
    # One recovery attempt after fixing the underlying configuration/availability.
    reconcile.fluxcd.io/requestedAt: "2026-11-12-health-recovery"
    reconcile.fluxcd.io/resetAt: "2026-11-12-health-recovery"
  name: keda-scaledobjects
  namespace: keda
spec:
  interval: 30m
  dependsOn:
    - name: keda
      namespace: keda
  chart:
    spec:
      chart: ./helm/keda-scaledobjects
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 12h
  releaseName: keda-scaledobjects
  install:
    createNamespace: false
  upgrade:
    cleanupOnFail: true

  values:
    swimto:
      # Single-instance databases with persistent storage are not horizontally scalable.
      postgres:
        enabled: false
      redis:
        enabled: false
