# Custom CoreDNS config to resolve *.eldertree.local inside the cluster.
# Without this, pods can't reach ingress hostnames like dex.eldertree.local,
# because CoreDNS only knows about cluster.local and upstream resolvers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  eldertree.server: |
    eldertree.local:53 {
      errors
      cache 30
      hosts {
        10.43.225.225 dex.eldertree.local
        10.43.225.225 flux.eldertree.local
        10.43.225.225 grafana.eldertree.local
        10.43.225.225 prometheus.eldertree.local
        10.43.225.225 vault.eldertree.local
        10.43.225.225 swimto.eldertree.local
        10.43.225.225 canopy.eldertree.local
        10.43.225.225 pitanga.eldertree.local
        10.43.225.225 docs.eldertree.local
        10.43.225.225 openclaw.eldertree.local
        10.43.225.225 control.eldertree.local
        10.43.225.225 elder.eldertree.local
        fallthrough
      }
      # fallthrough needs a next plugin, else unlisted *.eldertree.local names
      # (and search-suffixed public lookups like registry.npmjs.org.eldertree.local)
      # error with "plugin/hosts: no next plugin found", flooding errors and
      # crash-looping CoreDNS. Forward the fallthrough to BIND9 (bind9 svc
      # ClusterIP), which is authoritative for eldertree.local and NXDOMAINs junk.
      #
      # BOTH IPs above and below are ClusterIPs and therefore change whenever the
      # Service is recreated. When *.eldertree.local stops resolving, re-check them:
      #   kubectl get svc traefik -n kube-system -o jsonpath='{.spec.clusterIP}'
      #   kubectl get svc bind9   -n bind       -o jsonpath='{.spec.clusterIP}'
      forward . 10.43.237.251
    }
