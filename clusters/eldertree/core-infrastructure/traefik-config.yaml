# HelmChartConfig to customize k3s-managed Traefik
# Enables HA with 2 replicas for graceful node drains
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 2
    # maxSurge: 0 is required because pod-anti-affinity below is `required` on
    # hostname topology and only 2 nodes are schedulable (node-1 is labelled
    # `unstable`). With the chart's default maxSurge: 1, a rolling update would
    # try to land a 3rd pod that has no legal home and time out. maxUnavailable: 1
    # means we drop to a single Traefik pod briefly during a chart upgrade;
    # acceptable, same trade-off swimto's helmrelease.yaml documents for #228.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    # HA on stable nodes only (node-2/3). node-1 is labelled ``unstable`` by the
    # node-scheduling-tier-reconciler and has recurring hangs/reboots. Traefik is
    # the cluster's sole ingress -- losing the replica on node-1 with only a soft
    # (preferred) anti-affinity risked both replicas ending up co-located, or one
    # stuck on node-1, causing 503s across every *.eldertree.local / public
    # hostname during a node-1 outage. Same pattern as
    # clusters/eldertree/swimto/helmrelease.yaml.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: eldertree.xyz/node-tier
                  operator: NotIn
                  values:
                    - unstable
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
            topologyKey: kubernetes.io/hostname
    # Resource limits for Raspberry Pi
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    # Traefik metrics port (9100): do NOT expose on the LoadBalancer service.
    # k3s ServiceLB creates svclb-traefik pods with hostPort for each LB service port; exposing
    # port 9100 on the LB occupies hostPort 9100 on every node, blocking node-exporter DaemonSet
    # (which also needs hostPort 9100) from scheduling.
    # Prometheus scrapes via ClusterIP (traefik.kube-system.svc.cluster.local:9100) — no LB needed.
    ports:
      metrics:
        expose:
          default: false
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
    # LoadBalancer configuration for kube-vip
    # VIP 192.168.2.200 is assigned by kube-vip on wlan0 interface
    # ServiceLB (svclb pods) handles traffic forwarding to Traefik pods
    service:
      spec:
        loadBalancerIP: 192.168.2.200
