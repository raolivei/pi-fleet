---
# Temporary inventory for the 2026-08-26 network subnet migration.
# 2026-08-27 update: node-2 migrated (wlan0=10.0.0.102), node-3 reachable via eth0 (10.0.0.3).
# node-1 is in watchdog reboot loop — eth0 (10.0.0.1) not currently reachable; run separately.
# After the migration completes, use hosts.yml (wlan0 10.0.0.10x IPs).
all:
  children:
    raspberry_pi:
      vars:
        ansible_user: raolivei
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_raolivei
        ansible_python_interpreter: /usr/bin/python3
        poe_hat_enabled: true
      hosts:
        # node-1: wlan0 (10.0.0.101) — SSH broken due to missing /run/sshd.
        # Before running playbook: sudo mkdir -p /run/sshd && sudo systemctl restart ssh
        node-1:
          ansible_host: 10.0.0.101
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=15"
          watchdog_ping_peers:
            - "{{ node_2_eth0_ip }}"
            - "{{ node_3_eth0_ip }}"
        # node-2: migrated — now reachable via new wlan0 IP on home WiFi.
        node-2:
          ansible_host: 10.0.0.102
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          watchdog_ping_peers:
            - "{{ node_1_eth0_ip }}"
            - "{{ node_3_eth0_ip }}"
        # node-3: migrated — now reachable via new wlan0 IP.
        node-3:
          ansible_host: 10.0.0.103
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
          watchdog_ping_peers:
            - "{{ node_1_eth0_ip }}"
            - "{{ node_2_eth0_ip }}"
