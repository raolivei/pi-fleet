---
# Updated 2026-09-02: post-network-migration
# SSH from Mac uses management network (10.0.0.x) — k3s uses gigabit (192.168.2.x)
all:
  children:
    raspberry_pi:
      vars:
        ansible_user: raolivei
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519_raolivei
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=5"
        ansible_python_interpreter: /usr/bin/python3
        poe_hat_enabled: true
      hosts:
        node-1:
          ansible_host: "{{ node_1_mgmt_ip }}"
          watchdog_ping_peers:
            - "{{ node_2_mgmt_ip }}"
            - "{{ node_3_mgmt_ip }}"
        node-2:
          ansible_host: "{{ node_2_mgmt_ip }}"
          watchdog_ping_peers:
            - "{{ node_1_mgmt_ip }}"
            - "{{ node_3_mgmt_ip }}"
        node-3:
          ansible_host: "{{ node_3_mgmt_ip }}"
          watchdog_ping_peers:
            - "{{ node_1_mgmt_ip }}"
            - "{{ node_2_mgmt_ip }}"
