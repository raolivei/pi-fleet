---
# Network Configuration Variables for Eldertree Cluster
# These variables are used across all playbooks to avoid hardcoding
# Updated: 2026-09-02 - Network migration: homebase gigabit = 192.168.2.x (k3s),
#   home router WiFi = 10.0.0.x (internet + SSH from Mac)

# Gigabit / k3s Network (eth0 on node-2/3, wlan0 on node-1 — homebase switch)
# Used for k3s inter-node communication and kube-vip VIP. No internet access.
network_base: "192.168.2"
network_netmask: "255.255.255.0"

# WiFi / Management Network (wlan0 on node-2/3, eth0 on node-1 — home router)
# Used for internet access and SSH from Mac. Gateway is the home router.
management_network_base: "10.0.0"
management_gateway: "10.0.0.1"
management_dns:
  - "10.0.0.1"
  - "8.8.8.8"

# Legacy alias (homebase gigabit ≠ internet gateway; no default route on eth0/homebase)
network_gateway: ""

# homebase WiFi/Gigabit SSID (nodes join this to get their k3s IP)
wifi_ssid: "homebase"
wifi_psk: "homebase.io"

# Node IP Assignments — k3s/gigabit network (192.168.2.0/24, no internet)
node_1_ip: "192.168.2.101"
node_2_ip: "192.168.2.102"
node_3_ip: "192.168.2.103"

# Node IP Assignments — management/SSH network (10.0.0.0/24, internet + Mac SSH)
node_1_mgmt_ip: "10.0.0.101"
node_2_mgmt_ip: "10.0.0.102"
node_3_mgmt_ip: "10.0.0.103"

# kube-vip Virtual IP (for HA API server access, on gigabit/192.168.2.x)
kube_vip_ip: "192.168.2.100"

# k3s Configuration
# Updated: 2026-01-29 - Upgrade to v1.35.0+k3s1 (latest stable)
k3s_version: "v1.35.0+k3s1"
k3s_server_url: "https://{{ kube_vip_ip }}:6443"
k3s_cluster_init_node: "node-1"

# k3s uses gigabit/homebase IPs for inter-node communication (eth0 on node-2/3)
k3s_node_ip_node_1: "{{ node_1_ip }}"
k3s_node_ip_node_2: "{{ node_2_ip }}"
k3s_node_ip_node_3: "{{ node_3_ip }}"

# Legacy: old eth0 IPs before network migration (10.0.0.1/2/3). Kept for reference only.
# Do NOT use for k3s config — those interfaces are no longer the primary data path.
node_1_eth0_ip: "10.0.0.101"
node_2_eth0_ip: "10.0.0.102"
node_3_eth0_ip: "10.0.0.103"

# Flannel interface for CNI (use gigabit)
k3s_flannel_iface: "eth0"

# API server bind address
# IMPORTANT: Must be 0.0.0.0 for kube-vip to work properly
# If set to a specific IP (e.g., 10.0.0.1), the API server only listens
# on that interface and kube-vip VIP (192.168.2.100) cannot reach it
k3s_bind_address: "0.0.0.0"

# Services to disable on all nodes
# (Tailscale was previously disabled due to same-LAN routing conflicts; re-enabled as the path to access all services from Mac when Mac is never on gigabit — see docs/TAILSCALE.md)
disabled_services: []

# Hardware Watchdog Configuration
# Auto-reboot frozen nodes via BCM2835 watchdog
watchdog_timeout: 15
watchdog_max_load: 24
watchdog_ping_targets:
  - "{{ node_1_mgmt_ip }}"
  - "{{ node_2_mgmt_ip }}"
  - "{{ node_3_mgmt_ip }}"

# Boot Loop Protection
watchdog_max_boot_attempts: 5
watchdog_successful_boot_time: 600  # 10 minutes

# Node scheduling tiers (node-1 is deprioritized for app workloads — see docs/NODE_SCHEDULING.md)
node_scheduling_label_key: "eldertree.xyz/node-tier"
node_scheduling_taint_key: "eldertree.xyz/prefer-stable-nodes"
node_scheduling_taint_value: "true"
node_scheduling_taint_effect: "PreferNoSchedule"
node_scheduling_unstable_host: "node-1"
node_scheduling_stable_hosts:
  - "node-2"
  - "node-3"
# Backup Configuration
backup_mount_default: "/mnt/backup"
