---
# Network Subnet Revert
#
# Reverts the bad migration that placed wlan0 on 10.0.0.x and eth0 on 172.16.0.x.
# Returns nodes to:
#   wlan0 (homebase): 192.168.2.10x
#   eth0 (isolated):  10.0.0.x
#
# Note: since the nodes are currently accessible on 10.0.0.10x (wlan0)
# we connect to them on those IPs, then change them.

- name: Revert network subnets on all nodes
  hosts: raspberry_pi
  become: true
  serial: 1

  vars:
    current_wlan0_ips:
      node-1: "10.0.0.101"
      node-2: "10.0.0.102"
      node-3: "10.0.0.103"
    target_wlan0_ips:
      node-1: "192.168.2.101"
      node-2: "192.168.2.102"
      node-3: "192.168.2.103"
    target_eth0_ips:
      node-1: "10.0.0.1"
      node-2: "10.0.0.2"
      node-3: "10.0.0.3"
    target_kube_vip: "192.168.2.100"
    target_gateway: "192.168.2.1"
    target_dns: "192.168.2.1 8.8.8.8"

  tasks:
    - name: Set per-node IP facts
      set_fact:
        current_wlan0_ip: "{{ current_wlan0_ips[inventory_hostname] }}"
        target_wlan0_ip: "{{ target_wlan0_ips[inventory_hostname] }}"
        target_eth0_ip: "{{ target_eth0_ips[inventory_hostname] }}"

    # ── Network changes ──────────────────────────────────────────────────────
    - name: Update homebase (wlan0) NM connection
      command: >
        nmcli con modify homebase
        ipv4.addresses "{{ target_wlan0_ip }}/24"
        ipv4.gateway "{{ target_gateway }}"
        ipv4.dns "{{ target_dns }}"
        ipv4.method manual
      changed_when: true

    - name: Update eth0 NM connection
      command: >
        nmcli con modify eth0
        ipv4.addresses "{{ target_eth0_ip }}/24"
        ipv4.gateway ""
        ipv4.dns ""
        ipv4.method manual
      changed_when: true

    - name: Apply network changes in background
      shell: |
        nohup bash -c '
          sleep 1
          nmcli con up homebase
          sleep 3
          nmcli con up eth0
        ' > /tmp/netmig-revert-{{ inventory_hostname }}.log 2>&1 &
      async: 0
      poll: 0
      changed_when: true

    - name: Wait for node to come back (via tailscale if accessible)
      pause:
        seconds: 15

    # ── k3s config ───────────────────────────────────────────────────────────
    - name: Update k3s resolv.conf
      copy:
        dest: /etc/rancher/k3s/resolv.conf
        content: |
          nameserver 192.168.2.1
          nameserver 8.8.8.8
          search eldertree.local
        owner: root
        group: root
        mode: "0644"

    - name: Update k3s node-ip
      lineinfile:
        path: /etc/rancher/k3s/config.yaml
        regexp: '^node-ip:'
        line: "node-ip: {{ target_eth0_ip }}"

    - name: Update k3s advertise-address
      lineinfile:
        path: /etc/rancher/k3s/config.yaml
        regexp: '^advertise-address:'
        line: "advertise-address: {{ target_eth0_ip }}"

    - name: Update k3s server URL to new kube-vip VIP
      lineinfile:
        path: /etc/rancher/k3s/config.yaml
        regexp: '^server:'
        line: "server: https://{{ target_kube_vip }}:6443"

    - name: Rewrite k3s config.yaml with correct tls-san
      shell: |
        python3 - << 'PYEOF'
        import re, subprocess

        path = '/etc/rancher/k3s/config.yaml'
        try:
            with open(path) as f:
                content = f.read()
        except FileNotFoundError:
            print("No config.yaml found")
            exit(0)

        content = re.sub(
            r'^tls-san:(\n  - [^\n]+)+\n', '', content, flags=re.MULTILINE)

        new_san = (
            "tls-san:\n"
            "  - {{ target_kube_vip }}\n"
            "  - {{ target_wlan0_ip }}\n"
            "  - {{ target_eth0_ip }}\n"
            "  - {{ inventory_hostname }}.eldertree.local\n"
            "  - {{ inventory_hostname }}\n"
            "  - 10.0.0.100\n"
        )

        anchor = '# BEGIN ANSIBLE MANAGED - klipper-lb sysctl fix'
        if anchor in content:
            content = content.replace(anchor, new_san + anchor)
        else:
            content = content.rstrip('\n') + '\n' + new_san

        with open(path, 'w') as f:
            f.write(content)
        PYEOF
      args:
        executable: /bin/bash
      changed_when: true

    - name: Fix wait-for-eth0.sh
      replace:
        path: /usr/local/bin/wait-for-eth0.sh
        regexp: 'grep -qE "inet (10|172)\\\\."'
        replace: 'grep -q "inet 10\\."'

    - name: Update watchdog ping targets
      copy:
        dest: /etc/watchdog.conf
        content: |
          interval = 5
          ping = {{ target_eth0_ips['node-1'] }}
          ping = {{ target_eth0_ips['node-2'] }}
          ping = {{ target_eth0_ips['node-3'] }}
          file = /var/run/k3s-health
          change = 1
          watchdog-device = /dev/watchdog
          watchdog-timeout = 15
          max-load-1 = 24
          retry-timeout = 60
          repair-maximum = 5
          min-memory = 4096
        owner: root
        group: root
        mode: "0644"
      failed_when: false
      ignore_errors: true

    - name: Reload watchdog
      systemd:
        name: watchdog
        state: reloaded
      failed_when: false
      ignore_errors: true
